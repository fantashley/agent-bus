name: PR title

# PRs are squash-merged with the PR title as the commit message, and
# release-please reads those messages to pick the next version and write the
# changelog, so the title has to be a Conventional Commit.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional:
    name: conventional title
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style)(\([A-Za-z0-9._/-]+\))?!?: [^[:space:]]'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must be a Conventional Commit, e.g. 'feat: add doctor' or 'fix(peers): ...'. Got: $TITLE"
            exit 1
          fi
